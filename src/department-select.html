<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择事业部</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }
    .dept-list {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .dept-item {
      background: #fff;
      border: 2px solid #e8ecf0;
      border-radius: 10px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dept-item:hover {
      border-color: #4a90d9;
      background: #f0f6ff;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(74, 144, 217, 0.15);
    }
    .dept-item:active {
      transform: translateY(0);
    }
    .dept-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4a90d9, #357abd);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .dept-info {
      flex: 1;
      min-width: 0;
    }
    .dept-name {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dept-no {
      font-size: 12px;
      color: #999;
      margin-top: 2px;
    }
    .dept-arrow {
      color: #ccc;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="title">选择事业部</div>
  <div class="subtitle">请选择您要使用的事业部</div>
  <div class="dept-list" id="deptList"></div>

  <script>
    window.electronAPI.onDeptList((deptPairs) => {
      const container = document.getElementById('deptList');
      container.replaceChildren();

      deptPairs.forEach(dept => {
        const item = document.createElement('div');
        item.className = 'dept-item';

        const icon = document.createElement('div');
        icon.className = 'dept-icon';
        icon.textContent = String(dept.deptName || '?').charAt(0) || '?';

        const info = document.createElement('div');
        info.className = 'dept-info';

        const name = document.createElement('div');
        name.className = 'dept-name';
        name.textContent = dept.deptName || '未命名事业部';

        const number = document.createElement('div');
        number.className = 'dept-no';
        number.textContent = dept.deptNo || '';

        const arrow = document.createElement('div');
        arrow.className = 'dept-arrow';
        arrow.textContent = '›';

        info.append(name, number);
        item.append(icon, info, arrow);
        item.addEventListener('click', () => {
          window.electronAPI.selectDepartment(dept);
        });
        container.appendChild(item);
      });
    });
  </script>
</body>
</html>
