<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>云仓助手 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
      background: #fff;
      user-select: none;
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      background: #3a3a3a;
      -webkit-app-region: drag;
      padding: 0 10px;
    }
    .titlebar .title {
      color: #fff;
      font-size: 13px;
    }
    .titlebar .controls {
      display: flex;
      gap: 2px;
      -webkit-app-region: no-drag;
    }
    .titlebar .controls button {
      width: 32px;
      height: 28px;
      border: none;
      background: transparent;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .titlebar .controls button:hover {
      background: rgba(255,255,255,0.15);
    }
    .titlebar .controls .close-btn:hover {
      background: #e81123;
      color: #fff;
    }

    .login-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 36px);
      padding: 20px 40px;
    }
    .login-body h2 {
      color: #e67e22;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .login-body .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .login-btn {
      width: 260px;
      height: 46px;
      background: #e67e22;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #d35400;
    }

    .credential-box {
      width: 260px;
      margin-bottom: 18px;
    }
    .credential-box input {
      width: 100%;
      height: 38px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    .credential-box input:focus {
      border-color: #e67e22;
    }
    .credential-box input::placeholder {
      color: #bbb;
    }
    .save-hint {
      color: #aaa;
      font-size: 11px;
      text-align: right;
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .tip {
      color: #aaa;
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="title">云仓助手</span>
    <div class="controls">
      <button onclick="window.electronAPI.close()" class="close-btn">&times;</button>
    </div>
  </div>

  <div class="login-body">
    <h2>云仓助手</h2>
    <p class="subtitle">填写账号密码后点击登录，将自动填充到登录页面</p>
    <div class="credential-box">
      <input type="text" id="username" placeholder="京东账号" autocomplete="off" />
      <input type="password" id="password" placeholder="密码" autocomplete="off" />
      <p class="save-hint">账号密码仅保存在本地</p>
    </div>
    <button class="login-btn" id="loginBtn">登录商家端</button>
    <p class="tip">登录成功后将自动进入主界面</p>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // 加载已保存的凭据
    window.electronAPI.getCredentials().then(cred => {
      if (cred) {
        usernameInput.value = cred.username || '';
        passwordInput.value = cred.password || '';
      }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      // 保存凭据
      window.electronAPI.saveCredentials({ username, password });
      // 打开登录页面，传递凭据用于自动填充
      window.electronAPI.openWebLogin({ username, password });
    });
  </script>
</body>
</html>
